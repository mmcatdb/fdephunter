services:
    mongodb:
        container_name: "fdephunter-mongodb"
        restart: always
        image: mongo
        environment:
            MONGO_INITDB_ROOT_USERNAME: user
            MONGO_INITDB_ROOT_PASSWORD: password
        expose:
            - 27017
        ports:
            # Allows only localhost to access the database. This is important for security reasons, as it prevents external access to the database.
            - "127.0.0.1:5602:27017"

    backend:
        container_name: "fdephunter-backend"
        restart: always
        build:
            context: backend
            dockerfile: docker/Dockerfile
        expose:
            - 5601
        depends_on:
            - mongodb

    frontend:
        container_name: "fdephunter-frontend"
        restart: always
        build:
            # Sets source directory for all COPY, ADD, etc. commands in the Dockerfile
            context: frontend
            # Path to the dockerfile
            dockerfile: docker/Dockerfile
        ports:
            # Map localhost port to 80 in docker
            - 5600:80

networks:
    default:
        name: fdephunter-network
